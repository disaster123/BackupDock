[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "backupdock"
version = "0.3.1"
description = "Docker-aware backups with automatic bind mount and volume discovery, safe container stop/start and incremental backups."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docker>=7.1.0",
    "PyYAML>=6.0.2",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Archiving :: Backup",
]

[project.scripts]
backupdock = "backupdock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

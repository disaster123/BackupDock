# BackupDock has no built-in assumptions about where Docker data lives.
# Bind mounts and Docker volumes are discovered from the Docker daemon.

[restic]
# These can also be supplied through the normal RESTIC_REPOSITORY and
# RESTIC_PASSWORD_FILE environment variables.
repository = "sftp:backup@example:/backups/docker-host"
password_file = "/root/.config/restic/password"

# Optional arguments passed only to `restic backup`.
backup_args = []

[backup]
state_dir = "/var/lib/backupdock"
stop_timeout_seconds = 30
include_compose_metadata = true

# Static host data that is not managed by Docker. These paths are backed up
# separately without stopping any container. Leave empty unless needed.
host_paths = []

# Global source-path exclusions. No paths are excluded by default.
exclude_paths = []

# Global Docker-volume exclusions by Docker volume name. Prefer project-specific
# exclusions when a volume belongs to only one Compose project.
exclude_volumes = []

# Optional project-specific additions/exclusions. The TOML key is the Docker
# Compose project name as shown by `backupdock inventory`.
# [projects."my-compose-project"]
# extra_paths = ["/some/project-specific/path"]
# exclude_paths = ["/path/that/should/not/be/backed-up"]
# exclude_volumes = ["my-compose-project_large_rebuildable_data"]

[retention]
after_backup = false
prune = false
keep_daily = 14
keep_weekly = 8
keep_monthly = 12

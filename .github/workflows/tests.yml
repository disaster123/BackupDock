name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install BackupDock
        run: python -m pip install -e .
      - name: Validate shell scripts
        run: bash -n install.sh uninstall.sh
      - name: Validate example configuration
        run: python -c 'from pathlib import Path; from backupdock.config import load_config; load_config(Path("config.yaml.example"))'
      - name: Run tests
        run: python -m unittest discover -s tests -v

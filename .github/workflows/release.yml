name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify tag and package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          git merge-base --is-ancestor "${RELEASE_TAG}^{commit}" origin/main
          python - <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          if re.fullmatch(r"v\d+\.\d+\.\d+", tag) is None:
              raise SystemExit(f"Invalid release tag: {tag}")

          expected = tag.removeprefix("v")
          project_version = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          package_text = pathlib.Path("src/backupdock/__init__.py").read_text(
              encoding="utf-8"
          )
          match = re.search(r'^__version__\s*=\s*"([^"]+)"$', package_text, re.MULTILINE)
          package_version = match.group(1) if match else None

          if project_version != expected or package_version != expected:
              raise SystemExit(
                  "Release version mismatch: "
                  f"tag={expected}, pyproject={project_version}, package={package_version}"
              )

          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          if f"## [{expected}]" not in changelog:
              raise SystemExit(f"CHANGELOG.md has no release section for {expected}")
          PY
      - name: Install BackupDock
        run: python -m pip install -e .
      - name: Validate shell scripts
        run: bash -n install.sh uninstall.sh
      - name: Validate example configuration
        run: python -c 'from pathlib import Path; from backupdock.config import load_config; load_config(Path("config.yaml.example"))'
      - name: Run tests
        run: python -m unittest discover -s tests -v

  publish:
    needs: validate-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "BackupDock $GITHUB_REF_NAME" \
            --notes-file release-notes.md
